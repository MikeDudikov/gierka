name: Verify UE5 bootstrap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test source installer without Epic credentials
        run: python3 -m unittest discover -s tests -v
